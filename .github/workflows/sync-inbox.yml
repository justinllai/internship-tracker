# ============================================================
# Scheduled inbox sync — the "alarm clock" for the backend
# ------------------------------------------------------------
# Render's free tier sleeps after ~15 min without traffic, so the
# server can't run its own timer. Every 30 minutes this workflow
# calls /internal/sync-all, which wakes the server AND checks every
# connected inbox for company replies.
#
# Setup (GitHub repo → Settings → Secrets and variables → Actions):
#   BACKEND_URL  e.g. https://your-backend.onrender.com   (no trailing slash)
#   CRON_SECRET  same random value as the CRON_SECRET env var on Render
#
# Notes: GitHub may run scheduled jobs late during busy periods, and
# disables schedules after 60 days with no repo activity — the
# opportunistic sync when you open the site covers both cases.
# ============================================================
name: Sync tracked inboxes

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}     # "Run workflow" button for manual testing

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wake backend and trigger sync
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "BACKEND_URL / CRON_SECRET secrets not set — skipping."
            exit 0
          fi
          # Generous timeout + retries ride out Render's ~30-60s cold start
          curl --fail --silent --show-error --max-time 120 \
               --retry 3 --retry-delay 20 --retry-all-errors \
               -X POST "$BACKEND_URL/internal/sync-all" \
               -H "X-Cron-Secret: $CRON_SECRET"
