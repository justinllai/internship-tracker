# ============================================================
# Continuous Integration — run every test on every push / PR
# ------------------------------------------------------------
# If anything fails, GitHub shows a red ✗ on the commit before it
# ever reaches Vercel/Render. The frontend build runs with CI=true,
# exactly like Vercel, so lint warnings fail here first (the
# exhaustive-deps surprise from Session 6/7 can't happen again).
# ============================================================
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false
      - run: npm run build
